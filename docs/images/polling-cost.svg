<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#24332e" role="img" aria-labelledby="title desc">
  <title id="title">Polling vs. MCP waiting</title>
  <desc id="desc">Estimated API-equivalent costs. Run I with polling cost $43.22, including Claude $21.10 and Astra $22.12. Astra includes $9.75 of identified polling. Run J with MCP waiting cost $31.10, including Claude $22.99 and Astra $8.11. Two different runs of the same task, not a controlled measurement of polling alone.</desc>
  <rect width="720" height="350" rx="18" fill="#fffdf9"/>
  <g transform="translate(20,20)">
    <rect width="330" height="278" rx="16" fill="#f6f0e9"/>
    <text x="24" y="38" font-size="20" font-weight="600">With polling</text>
    <text x="24" y="108" font-size="54" font-weight="700" fill="#765848">$43.22</text>
    <text x="24" y="156" font-size="18">Claude (Opus 5.5)</text>
    <text x="306" y="156" font-size="18" text-anchor="end">$21.10</text>
    <text x="24" y="190" font-size="18">Astra</text>
    <text x="306" y="190" font-size="18" text-anchor="end">$22.12</text>
    <line x1="24" y1="211" x2="306" y2="211" stroke="#765848" stroke-opacity="0.2"/>
    <text x="24" y="248" font-size="17" fill="#765848">Includes $9.75 polling</text>
  </g>
<g transform="translate(370,20)">
    <rect width="330" height="278" rx="16" fill="#eaf4ee"/>
    <text x="24" y="38" font-size="20" font-weight="600">With MCP waiting</text>
    <text x="24" y="108" font-size="54" font-weight="700" fill="#166761">$31.10</text>
    <text x="24" y="156" font-size="18">Claude (Opus 5.5)</text>
    <text x="306" y="156" font-size="18" text-anchor="end">$22.99</text>
    <text x="24" y="190" font-size="18">Astra</text>
    <text x="306" y="190" font-size="18" text-anchor="end">$8.11</text>
    <line x1="24" y1="211" x2="306" y2="211" stroke="#166761" stroke-opacity="0.2"/>
    <text x="24" y="248" font-size="17" fill="#166761">No polling detected</text>
  </g>
  <text x="360" y="328" text-anchor="middle" font-size="16" fill="#59615b">Same task · runs I &amp; J · estimated API cost (USD)</text>
</svg>
